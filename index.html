<!DOCTYPE html>
<html lang="es" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocuCraft Pro | Suite & Editor de PDF Avanzado</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      // Aplica el color principal guardado ANTES de que React monte, para
      // no parpadear con el azul predeterminado. La paleta derivada la
      // escribe ThemeContext en 'pdftools-accent-palette' (ver accentColor.js).
      try {
        var savedPalette = JSON.parse(localStorage.getItem('pdftools-accent-palette') || 'null');
        var savedTheme = localStorage.getItem('theme');
        var isDark = savedTheme
          ? savedTheme === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (isDark) document.documentElement.classList.add('dark');
        if (savedPalette) {
          var vars = isDark ? savedPalette.dark : savedPalette.light;
          Object.keys(vars).forEach(function (name) {
            document.documentElement.style.setProperty(name, vars[name]);
          });
        }
      } catch (e) {}
    </script>
  </head>
  <body class="h-full bg-surface text-on-surface antialiased overflow-x-hidden selection:bg-primary-fixed selection:text-on-primary-fixed">
    <div id="root" class="h-full flex flex-col"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
